  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./api/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amend_landscaping
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  cerm-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cerm_user
      POSTGRES_PASSWORD: cerm_password
      POSTGRES_DB: cerm_db
    ports:
      - "5434:5432"
    volumes:
      - cerm_pg_data:/var/lib/postgresql/data

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile.dev
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - db
    ports:
      - "3001:3001"
    env_file:
      - ./api/.env 
    volumes:
      - ./api:/app 
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
    command: npm run dev

  cerm-api:
    build:
      context: ./cerm-api
      dockerfile: Dockerfile.dev
    depends_on:
      - cerm-db
    ports:
      - "8080:8080"
    volumes:
      - ./cerm-api:/app
    env_file:
      - ./cerm-api/.env
    environment:
      - PORT=8080
      - APP_ENV=development
      - DATABASE_URL=postgres://cerm_user:cerm_password@cerm-db:5432/cerm_db?sslmode=disable 

  # frontend:
  #   build: 
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   depends_on:
  #     - api
  #   ports:
  #     - "5174:5174"
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true
  #     - WATCHPACK_POLLING=true
  #   volumes:
  #     - ./frontend:/app 
  #     - /app/node_modules
  #   command: npm run dev -- --host 0.0.0.0 --port 5174

  cerm-frontend:
    build:
      context: ./cerm-frontend
      dockerfile: Dockerfile.dev
      args:
        CACHEBUST: ${CACHEBUST:-1}
    depends_on:
      - cerm-api
    ports:
      - "5175:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./cerm-frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pg_data:
  cerm_pg_data:
  prometheus_data:
  grafana_data: