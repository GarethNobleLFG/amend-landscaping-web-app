name: CI/CD Pipeline - Frontend (Dev)

on:
  push:
    branches: [ develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-dev-frontend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  REPO_NAME: amend-landscaping-repo

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set Environment
        run: |
          echo "ENV=dev" >> $GITHUB_ENV

      - name: Build and Push Frontend
        run: |
          API_URL=$(gcloud run services describe amend-api-${{ env.ENV }} --region ${{ env.REGION }} --format 'value(status.url)')
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ env.ENV }}-${{ github.sha }}
          
          docker build -t $IMAGE_NAME \
            --build-arg VITE_API_BASE_URL=$API_URL \
            -f frontend/Dockerfile.prod ./frontend
          docker push $IMAGE_NAME
          echo "FE_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amend-frontend-${{ env.ENV }}
          image: ${{ env.FE_IMAGE }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated --port=80