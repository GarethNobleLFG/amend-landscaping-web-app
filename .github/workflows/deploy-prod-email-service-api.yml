name: deploy-prod-email-service

on:
  push:
    branches: [ main ]
    paths:
      - 'email-service-api/**'
      - '.github/workflows/deploy-prod-email-service.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  REPO_NAME: amend-landscaping-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Email Service API
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/email-service-api:prod-${{ github.sha }}
          docker build -t $IMAGE_NAME -f email-service-api/Dockerfile ./email-service-api
          docker push $IMAGE_NAME
          echo "EMAIL_SERVICE_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy Email Service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: email-service-api-prod
          image: ${{ env.EMAIL_SERVICE_IMAGE }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            APP_ENV=production
            COMPANY_USER=${{ secrets.COMPANY_USER }}
            COMPANY_PASS=${{ secrets.COMPANY_PASS }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}